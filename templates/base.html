<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Students</title>
</head>
<body>

<h1>Django Student Project</h1>

<hr>

{% if request.user.is_authenticated %}

    <p>
        Salom, <b>{{ request.user.username }}</b>
    </p>

    <p>
        Role: {{ request.user.role|default:"No role" }}
    </p>

    <a href="{% url 'logout' %}">Logout</a>

{% else %}

    <a href="{% url 'login' %}">Login</a>
    <a href="{% url 'register' %}">Register</a>

{% endif %}

<hr>

{% block content %}
{% endblock %}

</body>
</html>
