<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
</head>
<body>

<h2>Login</h2>

<form method="post">
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">Login</button>
    <a href="{% url 'password_reset' %}">Forgot your password?</a>
</form>

<!-- ERRORS -->
{% if form.errors %}

        Login yoki captcha noto‘g‘ri
    </p>
{% endif %}

</body>
</html>
